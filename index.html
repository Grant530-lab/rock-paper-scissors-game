<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✊ ✋ ✌️ 猜拳大戰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            color: #333;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .score-card.player {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .score-card.computer {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .score-label {
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .score-number {
            font-size: 3em;
            font-weight: bold;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .player-section, .result-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
        }

        .section-title {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }

        .choice-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .choice-btn {
            padding: 20px;
            border: 3px solid #ddd;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .choice-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }

        .choice-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }

        .emoji {
            font-size: 2.5em;
            display: block;
        }

        .result-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .vs-display {
            font-size: 1.2em;
            color: #666;
            text-align: center;
        }

        .vs-choices {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
        }

        .vs-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .vs-emoji {
            font-size: 3em;
        }

        .vs-name {
            font-size: 0.9em;
            color: #666;
        }

        .vs-vs {
            font-size: 1.5em;
            color: #999;
            font-weight: bold;
        }

        .result-text {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            min-height: 40px;
        }

        .result-text.win {
            color: #f5576c;
        }

        .result-text.lose {
            color: #4facfe;
        }

        .result-text.draw {
            color: #ffa502;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .game-area {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .scoreboard {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .choice-buttons {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .choice-btn {
                padding: 15px 10px;
                font-size: 0.9em;
            }

            .emoji {
                font-size: 2em;
            }

            .result-box {
                min-height: auto;
                padding: 20px;
            }

            .vs-emoji {
                font-size: 2.2em;
            }

            .result-text {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✊ ✋ ✌️ 猜拳大戰</h1>
            <p class="subtitle">挑戰電腦，看誰贏！</p>
        </header>

        <div class="scoreboard">
            <div class="score-card player">
                <div class="score-label">你</div>
                <div class="score-number" id="playerScore">0</div>
            </div>
            <div class="score-card">
                <div class="score-label">平手</div>
                <div class="score-number" id="drawScore">0</div>
            </div>
            <div class="score-card computer">
                <div class="score-label">電腦</div>
                <div class="score-number" id="computerScore">0</div>
            </div>
        </div>

        <div class="game-area">
            <div class="player-section">
                <h2 class="section-title">你的選擇</h2>
                <div class="choice-buttons">
                    <button class="choice-btn" data-choice="rock">
                        <span class="emoji">✊</span>
                        <span>石頭</span>
                    </button>
                    <button class="choice-btn" data-choice="paper">
                        <span class="emoji">✋</span>
                        <span>布</span>
                    </button>
                    <button class="choice-btn" data-choice="scissors">
                        <span class="emoji">✌️</span>
                        <span>剪刀</span>
                    </button>
                </div>
            </div>

            <div class="result-section">
                <h2 class="section-title">結果</h2>
                <div class="result-box">
                    <p class="vs-display">開始猜拳吧！</p>
                    <div class="vs-choices" id="vsChoices" style="display: none;">
                        <div class="vs-item">
                            <div class="vs-emoji" id="playerEmoji"></div>
                            <div class="vs-name">你</div>
                        </div>
                        <div class="vs-vs">VS</div>
                        <div class="vs-item">
                            <div class="vs-emoji" id="computerEmoji"></div>
                            <div class="vs-name">電腦</div>
                        </div>
                    </div>
                    <p class="result-text" id="resultText"></p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn reset-btn" id="resetBtn">🔄 重置分數</button>
        </div>
    </div>

    <script>
        const CHOICES = {
            rock: { emoji: '✊', name: '石頭' },
            paper: { emoji: '✋', name: '布' },
            scissors: { emoji: '✌️', name: '剪刀' }
        };

        const GAME_LOGIC = {
            rock: 'scissors',
            paper: 'rock',
            scissors: 'paper'
        };

        let scores = {
            player: 0,
            draw: 0,
            computer: 0
        };

        const playerScoreEl = document.getElementById('playerScore');
        const drawScoreEl = document.getElementById('drawScore');
        const computerScoreEl = document.getElementById('computerScore');
        const resultTextEl = document.getElementById('resultText');
        const vsChoicesEl = document.getElementById('vsChoices');
        const playerEmojiEl = document.getElementById('playerEmoji');
        const computerEmojiEl = document.getElementById('computerEmoji');
        const choiceButtons = document.querySelectorAll('.choice-btn');
        const resetBtn = document.getElementById('resetBtn');

        function getComputerChoice() {
            const choices = Object.keys(CHOICES);
            return choices[Math.floor(Math.random() * choices.length)];
        }

        function judgeWinner(playerChoice, computerChoice) {
            if (playerChoice === computerChoice) {
                return 'draw';
            }
            if (GAME_LOGIC[playerChoice] === computerChoice) {
                return 'player';
            }
            return 'computer';
        }

        function updateScores() {
            playerScoreEl.textContent = scores.player;
            drawScoreEl.textContent = scores.draw;
            computerScoreEl.textContent = scores.computer;
        }

        function displayResult(playerChoice, computerChoice, result) {
            playerEmojiEl.textContent = CHOICES[playerChoice].emoji;
            computerEmojiEl.textContent = CHOICES[computerChoice].emoji;
            vsChoicesEl.style.display = 'flex';

            resultTextEl.className = 'result-text';

            if (result === 'player') {
                resultTextEl.textContent = '🎉 你贏了！';
                resultTextEl.classList.add('win');
                scores.player++;
            } else if (result === 'computer') {
                resultTextEl.textContent = '😢 電腦贏了';
                resultTextEl.classList.add('lose');
                scores.computer++;
            } else {
                resultTextEl.textContent = '🤝 平手';
                resultTextEl.classList.add('draw');
                scores.draw++;
            }

            updateScores();
        }

        function clearActiveButton() {
            choiceButtons.forEach(btn => btn.classList.remove('active'));
        }

        choiceButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                clearActiveButton();
                btn.classList.add('active');

                const playerChoice = btn.dataset.choice;
                const computerChoice = getComputerChoice();
                const result = judgeWinner(playerChoice, computerChoice);

                setTimeout(() => {
                    displayResult(playerChoice, computerChoice, result);
                }, 300);
            });
        });

        resetBtn.addEventListener('click', () => {
            scores = { player: 0, draw: 0, computer: 0 };
            updateScores();
            clearActiveButton();
            resultTextEl.textContent = '';
            resultTextEl.className = 'result-text';
            vsChoicesEl.style.display = 'none';
        });

        updateScores();
    </script>
</body>
</html>
